name: Release

on:
  push:
    tags:
      - "v*" # triggers on any tag like v1.0.0, v1.2.3, etc.
  # Run the test jobs on candidate changes before merge. The paths filter keeps
  # docs-only PRs from spinning up Windows runners. Release jobs are guarded
  # per-job with `if: startsWith(github.ref, 'refs/tags/')` below, so this
  # trigger can NEVER create or publish a GitHub Release.
  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - "host/**"
      - ".github/workflows/android-release.yml"
  # Manual runs for ad-hoc verification of the test jobs (release jobs stay
  # tag-guarded here too).
  workflow_dispatch:

jobs:
  # ── Job 0: unit tests on both packages ──────────────────────────────────
  # Runs first and fails fast: a broken normalisation rule should stop the
  # release before it spends ten minutes building native modules.
  #
  # Windows, not Ubuntu: the host package depends on echoaudio, a Windows-only
  # native module, so `npm ci` refuses to install on Linux (EBADPLATFORM). The
  # host tests themselves never load it — they cover pure logic and injected
  # fakes — but the dependencies have to install for them to run at all.
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            host/package-lock.json

      - name: Install host dependencies
        working-directory: host
        run: npm ci

      - name: Host tests
        working-directory: host
        run: npm test

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Client tests
        working-directory: client
        run: npm test

  # ── Job 0b: Playwright viewport matrix ────────────────────────────────
  # Windows, same precedent as the `test` job: Chromium runs there without
  # extra system deps, so no ubuntu + `--with-deps` dance is needed.
  # No separate build step: client/playwright.config.ts's webServer runs
  # `npm run build && npm run preview -- --port 4173 --strictPort` itself
  # (reuseExistingServer: false), and `playwright test` finds the specs via
  # the config's testDir — `npm run test:viewport` is the whole suite.
  #
  # Deliberately INDEPENDENT of `test` (no `needs:`): a host/client unit-test
  # flake must not mask a viewport regression — each suite keeps its own
  # signal. Runs on every event including tag pushes (for reporting), but the
  # release jobs deliberately do NOT depend on it: a transient browser-test
  # flake must not block a `v*` release.
  viewport:
    name: Viewport matrix
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci
        env:
          # Browser binaries are staged by the dedicated step below, not twice
          # via the npm postinstall.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Installs chromium into Playwright's own CI-managed browser cache —
      # never set PLAYWRIGHT_BROWSERS_PATH to a local path here.
      - name: Install Chromium
        working-directory: client
        run: npx playwright install chromium

      - name: Viewport suite
        working-directory: client
        run: npm run test:viewport

  # ── Job 1: Android APK ───────────────────────────────────────────────────
  # RELEASE-ONLY. The workflow now also fires on pull_request and
  # workflow_dispatch; on those refs github.ref_name is a branch/pr number,
  # so these jobs MUST be skipped or they would publish a bogus release.
  # `startsWith(github.ref, 'refs/tags/')` is the hard gate: a push/PR can
  # never create or publish a GitHub Release.
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web bundle
        working-directory: client
        run: npm run build

      - name: Capacitor sync
        working-directory: client
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: client/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk \
             echodeck-${{ github.ref_name }}.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          name: "EchoDeck ${{ github.ref_name }}"
          body: |
            ## EchoDeck ${{ github.ref_name }}

            ### 🖥️ Windows
            Download and run `EchoDeck-Setup.exe`

            ### 📱 Android
            1. Download `echodeck-${{ github.ref_name }}.apk` below
            2. On your phone: **Settings → Install unknown apps** → allow your browser/file manager
            3. Open the APK and install

            ### What's new
            <!-- Edit this release on GitHub to add your changelog -->
          files: echodeck-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 2: Windows EXE ───────────────────────────────────────────────────────
  # RELEASE-ONLY — same tag gate as build-apk above.
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            client/package-lock.json
            host/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web bundle
        working-directory: client
        run: npm run build

      - name: Install host dependencies
        working-directory: host
        run: npm ci

      # electron-builder's predist script runs @electron/rebuild automatically
      - name: Build Windows installer
        working-directory: host
        run: npm run dist
        env:
          # Tells electron-builder not to publish — we upload manually below
          EP_DRAFT: false
          EP_PRE_RELEASE: false

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          name: "EchoDeck ${{ github.ref_name }}"
          files: host/dist/EchoDeck-Setup.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
